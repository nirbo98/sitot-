<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3.5 ימים — שיטות מחקר מתאמיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171A2E; --paper:#EDEFF3; --card:#FFFFFF; --muted:#616880;
  --line:#DBDFE7; --line2:#EBEEF2;
  --x1:#2A5CA8; --x2:#B33A66; --shared:#6E4A92;
  --good:#186B53; --trap:#8A6712; --soft:#F6F7FA;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Assistant',-apple-system,'Segoe UI',Arial,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.72;
  font-size:16.5px; padding-bottom:70px;
}
h1,h2,h3,.disp{font-family:'Frank Ruhl Libre','Assistant',Georgia,serif;line-height:1.3}
.mono{font-family:'IBM Plex Mono',monospace;direction:ltr;unicode-bidi:embed}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}

/* ---------- top ---------- */
header{background:var(--ink);color:#fff;padding:22px 0 18px}
header h1{font-size:26px;font-weight:900;letter-spacing:-.3px}
header .sub{color:#A9B0C6;font-size:14.5px;margin-top:3px}
nav.top{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
nav.top button{
  background:rgba(255,255,255,.09);color:#DDE2EE;border:1px solid rgba(255,255,255,.14);
  padding:7px 14px;border-radius:99px;font:600 14px 'Assistant',sans-serif;cursor:pointer
}
nav.top button.on{background:#fff;color:var(--ink);border-color:#fff}

/* ---------- days ---------- */
.days{display:flex;gap:8px;margin:20px 0 6px;overflow-x:auto;padding-bottom:4px}
.day{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 16px;cursor:pointer;min-width:112px;text-align:center
}
.day.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font:700 15px 'Frank Ruhl Libre',serif}
.day .dm{font-size:12.5px;color:var(--muted);line-height:1.4}
.dayintro{
  background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--ink);
  border-radius:var(--r);padding:14px 16px;margin:12px 0 18px;font-size:15px;color:#3C4257
}

/* ---------- block cards ---------- */
.blk{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;margin-bottom:11px;cursor:pointer;display:flex;gap:14px;align-items:flex-start;
  transition:transform .12s, box-shadow .12s
}
.blk:hover{transform:translateY(-1px);box-shadow:0 3px 14px rgba(23,26,46,.07)}
.blk .num{
  flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--soft);
  border:1px solid var(--line);display:grid;place-items:center;
  font:500 14px 'IBM Plex Mono',monospace;color:var(--muted)
}
.blk.done .num{background:var(--good);border-color:var(--good);color:#fff}
.blk h3{font-size:18px;font-weight:700}
.blk p{font-size:14.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:6px}
.tag.core{background:#EAF0F9;color:var(--x1)}
.tag.mid{background:#F4EDF1;color:var(--x2)}
.tag.easy{background:#E9F2EF;color:var(--good)}

/* ---------- block view ---------- */
.back{background:none;border:none;color:var(--muted);font:600 15px 'Assistant',sans-serif;cursor:pointer;padding:14px 0 6px}
.bhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.bhead h2{font-size:24px;font-weight:900}
.bhead .why{font-size:14.5px;color:var(--muted);margin-top:6px}
.timer{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line2)}
.timer .t{font:500 21px 'IBM Plex Mono',monospace;letter-spacing:-1px}
.timer button{background:var(--ink);color:#fff;border:none;padding:6px 15px;border-radius:8px;font:600 13.5px 'Assistant',sans-serif;cursor:pointer}
.timer button.ghost{background:none;color:var(--muted);border:1px solid var(--line)}

.phases{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin-bottom:14px}
.phases button{
  flex:1;background:none;border:none;padding:9px 4px;border-radius:8px;
  font:600 14.5px 'Assistant',sans-serif;color:var(--muted);cursor:pointer
}
.phases button.on{background:var(--ink);color:#fff}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 19px}
.panel p{margin-bottom:13px}
.panel h4{font:700 17px 'Frank Ruhl Libre',serif;margin:20px 0 8px}
.panel h4:first-child{margin-top:0}
.k{font-weight:700}
.f{
  display:block;background:var(--soft);border:1px solid var(--line2);border-radius:9px;
  padding:11px 13px;margin:12px 0;font-family:'IBM Plex Mono',monospace;font-size:14.5px;
  direction:ltr;text-align:left;overflow-x:auto
}
.trapbox{background:#FBF7E9;border:1px solid #EAE0BE;border-radius:11px;padding:13px 15px;margin:14px 0}
.trapbox b{color:var(--trap);font-size:13px;letter-spacing:.4px;display:block;margin-bottom:5px}
.trapbox ul{margin:0;padding-inline-start:19px}
.trapbox li{font-size:15px;margin-bottom:6px}
.keybox{background:#EDF1F8;border:1px solid #D5DEEE;border-radius:11px;padding:13px 15px;margin:14px 0}
.keybox b{color:var(--x1);font-size:13px;letter-spacing:.4px;display:block;margin-bottom:5px}
.keybox ul{margin:0;padding-inline-start:19px}
.keybox li{font-size:15px;margin-bottom:6px}

/* venn */
.venn{margin:16px auto;display:block;max-width:340px;width:100%}
.vcap{text-align:center;font-size:13.5px;color:var(--muted);margin:-4px 0 16px}

/* ---------- sheet builder ---------- */
.sheetnote{background:var(--soft);border-radius:11px;padding:13px 15px;font-size:15px;color:#3C4257;margin-bottom:18px;border:1px solid var(--line2)}
.slot{margin-bottom:20px}
.slot label{display:block;font:600 15.5px 'Assistant',sans-serif;margin-bottom:3px}
.slot .hint{font-size:13.5px;color:var(--muted);margin-bottom:7px}
.slot textarea{
  width:100%;min-height:78px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
  font:400 15.5px 'Assistant',sans-serif;line-height:1.65;resize:vertical;background:#FCFDFE;color:var(--ink)
}
.slot textarea:focus{outline:none;border-color:var(--x1);background:#fff}
.must{background:#EDF3F1;border:1px solid #CFE0DA;border-radius:11px;padding:13px 15px;margin-top:6px}
.must b{color:var(--good);font-size:13px;letter-spacing:.4px;display:block;margin-bottom:6px}
.must li{font-size:14.5px;margin-bottom:5px}
.must ul{margin:0;padding-inline-start:19px}

/* ---------- questions ---------- */
.q{border-bottom:1px solid var(--line2);padding-bottom:20px;margin-bottom:20px}
.q:last-child{border:none;margin-bottom:0;padding-bottom:0}
.qn{font:500 12.5px 'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.5px}
.qt{font-size:16.5px;font-weight:600;margin:4px 0 12px;line-height:1.65}
.opt{
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;
  cursor:pointer;font-size:15.5px;background:#fff;transition:border-color .12s
}
.opt:hover{border-color:#B9C1D0}
.opt.sel-ok{border-color:var(--good);background:#EDF6F2;border-width:2px}
.opt.sel-no{border-color:var(--x2);background:#FBF0F4;border-width:2px}
.opt.rev-ok{border-color:var(--good);background:#F4FAF7}
.opt .ex{display:none;font-size:14px;color:#48506A;margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07);line-height:1.6}
.opt.shown .ex{display:block}
.qnote{background:var(--soft);border-radius:9px;padding:11px 13px;font-size:14.5px;margin-top:10px;display:none;border:1px solid var(--line2)}
.qnote.shown{display:block}
.qnote b{color:var(--x1)}

/* ---------- print / traps / start ---------- */
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px}
.mini h3{font-size:19px;font-weight:700;margin-bottom:8px}
.mini p{font-size:15px;color:#3C4257;margin-bottom:10px}
.btn{background:var(--ink);color:#fff;border:none;padding:11px 20px;border-radius:10px;font:700 15px 'Assistant',sans-serif;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:13px;color:var(--muted);margin:0 5px 5px 0}

table.cmp{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 11px;text-align:right;vertical-align:top}
table.cmp th{background:var(--soft);font-weight:700}
table.cmp td:first-child{font-weight:600;background:#FCFDFE;width:26%}

.progressbar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
.progressbar div{height:100%;background:var(--good);width:0;transition:width .3s}

footer{text-align:center;color:var(--muted);font-size:13px;padding:34px 16px 20px}

/* print sheets */
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  .psheet{page-break-after:always;padding:14mm 12mm;font-size:11.5pt;line-height:1.5}
  .psheet h2{font-size:16pt;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:10px}
  .psheet h3{font-size:12.5pt;margin:10px 0 3px}
  .psheet .pv{white-space:pre-wrap;margin-bottom:9px}
  .psheet .pf{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:left;background:#f2f2f2;padding:5px 8px;margin:5px 0;font-size:10.5pt}
  .psheet .pt{border-inline-start:3px solid #000;padding-inline-start:8px;margin:6px 0;font-size:10.5pt}
}
@media (max-width:520px){
  body{font-size:16px}
  header h1{font-size:22px}
  .panel{padding:16px 15px}
  .phases button{font-size:13.5px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>3.5 ימים לשיטות מחקר מתאמיות</h1>
    <div class="sub">בלוקים של 25 דקות · לומדים, כותבים את דף העזר, פותרים · קידוד דמי לא בחומר</div>
    <nav class="top">
      <button data-v="track" class="on">המסלול</button>
      <button data-v="sheets">דפי העזר שלי</button>
      <button data-v="traps">מפת המלכודות</button>
      <button data-v="how">איך עובדים עם זה</button>
    </nav>
    <div class="progressbar"><div id="pbar"></div></div>
  </div>
</header>

<div class="wrap" id="app"></div>
<div id="printArea"></div>

<footer>נבנה מהתרגולים והשיעורים של הקורס · ההתקדמות נשמרת בדפדפן הזה</footer>

<script>
/* ================= state ================= */
var MEM={};
var S={
  save:function(k,v){try{localStorage.setItem('mtm_'+k,v)}catch(e){MEM[k]=v}},
  load:function(k){try{var r=localStorage.getItem('mtm_'+k);return r===null?(MEM[k]||''):r}catch(e){return MEM[k]||''}}
};
var view='track', day=0, openBlock=null, phase=0;

/* ================= venn ================= */
var vid=0;
function venn(hi,cap){
  var id='v'+(vid++);
  var H=hi||[];
  function on(k){return H.indexOf(k)>-1}
  function col(k,base){return on(k)?base:'#E8EBF1'}
  return '<svg class="venn" viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">'+
  '<defs>'+
    '<clipPath id="'+id+'y"><circle cx="150" cy="70" r="58"/></clipPath>'+
    '<clipPath id="'+id+'a"><circle cx="115" cy="120" r="52"/></clipPath>'+
    '<clipPath id="'+id+'b"><circle cx="185" cy="120" r="52"/></clipPath>'+
    '<mask id="'+id+'nb"><rect width="300" height="190" fill="#fff"/><circle cx="185" cy="120" r="52" fill="#000"/></mask>'+
    '<mask id="'+id+'na"><rect width="300" height="190" fill="#fff"/><circle cx="115" cy="120" r="52" fill="#000"/></mask>'+
    '<mask id="'+id+'ny"><rect width="300" height="190" fill="#fff"/><circle cx="150" cy="70" r="58" fill="#000"/></mask>'+
  '</defs>'+
  /* Y only */
  '<g clip-path="url(#'+id+'y)"><rect width="300" height="190" fill="'+col('yOnly','#C3CAD8')+'" mask="url(#'+id+'na)"/></g>'+
  '<g clip-path="url(#'+id+'y)"><g clip-path="url(#'+id+'a)"><rect width="300" height="190" fill="'+(on('yOnly')?'#C3CAD8':'#E8EBF1')+'" mask="url(#'+id+'nb)" opacity="0"/></g></g>'+
  /* x1 unique in Y */
  '<g clip-path="url(#'+id+'y)"><g clip-path="url(#'+id+'a)"><rect width="300" height="190" fill="'+col('x1','#2A5CA8')+'" mask="url(#'+id+'nb)"/></g></g>'+
  /* x2 unique in Y */
  '<g clip-path="url(#'+id+'y)"><g clip-path="url(#'+id+'b)"><rect width="300" height="190" fill="'+col('x2','#B33A66')+'" mask="url(#'+id+'na)"/></g></g>'+
  /* shared in Y */
  '<g clip-path="url(#'+id+'y)"><g clip-path="url(#'+id+'a)"><g clip-path="url(#'+id+'b)"><rect width="300" height="190" fill="'+col('shared','#6E4A92')+'"/></g></g></g>'+
  /* x1x2 outside Y */
  '<g clip-path="url(#'+id+'a)"><g clip-path="url(#'+id+'b)"><rect width="300" height="190" fill="'+col('out','#9AA2B4')+'" mask="url(#'+id+'ny)"/></g></g>'+
  /* outlines */
  '<circle cx="150" cy="70" r="58" fill="none" stroke="#171A2E" stroke-width="1.6"/>'+
  '<circle cx="115" cy="120" r="52" fill="none" stroke="#2A5CA8" stroke-width="1.6"/>'+
  '<circle cx="185" cy="120" r="52" fill="none" stroke="#B33A66" stroke-width="1.6"/>'+
  '<text x="150" y="26" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#171A2E">Y</text>'+
  '<text x="74" y="150" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="#2A5CA8">X1</text>'+
  '<text x="226" y="150" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="#B33A66">X2</text>'+
  '</svg>'+(cap?'<div class="vcap">'+cap+'</div>':'');
}

/* ================= content ================= */
var DAYS=[
 {n:'יום 1',m:'הליבה הקשה',intro:'היום הזה נושא את רוב הציון. ארבעה בלוקים, הפסקה של 5 דקות בין בלוק לבלוק. אל תעברי לבלוק הבא לפני שכתבת את דף העזר של הנוכחי — הכתיבה היא הלימוד עצמו.'},
 {n:'יום 2',m:'הבחנות ומספרים',intro:'היום של ההבחנות שמפילות: מיתון מול תיווך, ו־ΔR² שמחבר את הכל. ארבעה בלוקים.'},
 {n:'יום 3',m:'הבסיס והזול',intro:'חזרה על מדדי הקשר, ואז שלושה נושאים שמניבים נקודות בזול. ארבעה בלוקים.'},
 {n:'חצי יום',m:'ניווט וחזרה',intro:'לא לומדים חומר חדש. עוברים על מפת המלכודות, ומתאמנים למצוא דברים בדפים שכתבת — זה מה שיחסוך לך זמן במבחן.'}
];

var B=[
/* ============ 1 ============ */
{d:0,t:'מה מקדם ברגרסיה מרובה בכלל אומר',lvl:'core',
 why:'כל שאלה תיאורטית על רגרסיה מרובה נשענת על זה. אם זה לא חד — כלום אחר כך לא יהיה חד.',
 venn:['x1'],vcap:'b₁ מתאר רק את החלק הכחול: מה ש־X1 מסביר ב־Y ורק הוא.',
 learn:[
  {h:'הרעיון האחד שצריך להחזיק',p:['ברגרסיה פשוטה, b הוא פשוט הקשר בין X ל־Y. ברגרסיה מרובה זה משתנה לגמרי: <span class="k">b₁ הוא הקשר בין X1 ל־Y בהחזקת כל שאר המנבאים קבועים</span>. כלומר — הקשר של החלק ב־X1 שאין לו כלום עם X2.',
  'בתרגול זה מנוסח בדיוק כך: מקדם הרגרסיה של מנבא מסוים מסביר את <span class="k">טעויות הניבוי</span> של המנבא האחר. תרגמי: b₂ הוא הקשר בין השארית של X2 (מה שנשאר ממנו אחרי שניכינו את X1) לבין Y. זו הסיבה שהמקדם נקרא "התרומה הייחודית".',
  'מכאן נגזרת המסקנה שנבחנת הכי הרבה: כשמוסיפים מנבא למודל, המקדם של המנבא הקיים <span class="k">משתנה</span>. הוא יכול לקטון, לגדול, ואפילו להפוך סימן. זה לא תקלה ולא סתירה — זה בדיוק המידע שהמודל נותן.']},
  {h:'b מול β — שני דברים שונים',p:['<span class="k">b</span> נמדד ביחידות הגולמיות. "לכל שנת לימוד נוספת, המשכורת עולה ב־b שקלים." הוא תלוי לחלוטין ביחידות המדידה. אם תמדדי את המשכורת באגורות — b יגדל פי 100, בלי ששום דבר במציאות השתנה.',
  '<span class="k">β</span> הוא אותו מקדם כשכל המשתנים בציוני תקן. "לכל סטיית תקן ב־X, Y משתנה ב־β סטיות תקן." כי הוא חסר יחידות, אפשר להשוות בעזרתו בין מנבאים <span class="k">בתוך אותו מודל</span>. עם b אי אפשר.'],
  f:['b = r · (Sy / Sx)','β = b · (Sx / Sy)','רגרסיה פשוטה בלבד:  β = r']},
  {h:'למה זה מייצר שאלות',p:['שאלה תיאורטית טיפוסית לא תשאל "מה זה β". היא תיתן לך מצב — מקדם ירד, מקדם קפץ, שני מקדמים בגדלים שונים — ותשאל מה נובע מזה. התשובה כמעט תמיד מסתמכת על משפט אחד: המקדם מתאר את החלק הייחודי, ולכן הוא רגיש למה שעוד יש במודל.']}
 ],
 key:['ברגרסיה מרובה b = הקשר של החלק הייחודי, לא הקשר הפשוט','β משווה בין מנבאים באותו מודל; b לא','ברגרסיה פשוטה עם מנבא אחד: β = r','שינוי במקדם בעקבות הוספת מנבא = מידע, לא בעיה'],
 traps:['b גדול יותר ≠ מנבא חזק יותר. זה יכול להיות רק עניין של יחידות מדידה.','β ברגרסיה מרובה יכול לחרוג מ־1± (בעיקר במולטיקוליניאריות או דיכוי). ברגרסיה פשוטה — לא.','"בהחזקת שאר המשתנים קבועים" זו אמירה סטטיסטית, לא ניסויית. לא באמת החזקנו משהו קבוע.'],
 slots:[
  {l:'מה b אומר ברגרסיה מרובה — במילים שלי',h:'משפט אחד. אם את משתמשת במילה "ייחודי" — הסבירי ייחודי ביחס למה.'},

{d:1,t:'אינטראקציה ומיתון',lvl:'core',

  {h:'איך זה נראה בגרף',p:['בלי אינטראקציה, קווי הרגרסיה של X ל־Y ברמות שונות של M הם <span class="k">מקבילים</span> — הפרש קבוע. עם אינטראקציה, הקווים <span class="k">אינם מקבילים</span>: הם מתכנסים, מתפצלים או מצטלבים. אם מוצג לך גרף בשאלה — זו הבדיקה היחידה שצריך לעשות.']}
 ],

  {l:'מרכוז — מה משתנה ומה לא',h:'שתי רשימות קצרות.'},
  {l:'איך זה נראה בגרף',h:'ציירי שני זוגות קווים: מקבילים ולא מקבילים.'}
 ],

 qs:[
  {q:'במודל עם אינטראקציה: b₃ (המכפלה) מובהק, b₁ (המנבא) אינו מובהק. המנבאים לא מורכזו. מה מסיקים?',
   o:[{t:'אין קשר בין X ל־Y כאשר M=0, אבל יש קשר ברמות אחרות של M',ok:1,w:'b₁ מתייחס רק לנקודה שבה M=0. חוסר מובהקות שם לא אומר דבר על שאר הטווח, וb₃ המובהק מלמד שהקשר משתנה לאורך M.'},
     {t:'אין קשר בין X ל־Y בכלל',w:'זו בדיוק המלכודת. b₁ הוא שיפוע מקומי בנקודה אחת, לא הצהרה על כלל הנתונים.'},
     {t:'התוצאות סותרות ויש בעיה במודל',w:'אין כאן שום סתירה. זהו דפוס שכיח ותקין לגמרי במודלים עם אינטראקציה לא ממורכזת.'},
     {t:'יש להסיר את מקדם האינטראקציה',w:'להסיר את המקדם המובהק יבטל את הממצא המרכזי. אם כבר — כדאי למרכז ולפרש מחדש.'}],

  {q:'בגרף מוצגים קווי רגרסיה של X ל־Y עבור שלוש רמות של M, והם מקבילים לחלוטין. מה נכון?',

     {t:'אין קשר בין X ל־Y',w:'אם לקווים יש שיפוע, יש קשר. ההקבלה אומרת רק שהשיפוע אחיד.'},

   n:'שימי לב: אותה תוכנית, אותו משתנה שלישי — שני מודלים שונים לגמרי, לפי הניסוח בלבד.'},
  {q:'חוקר רוצה לבדוק אם הקשר בין ותק לשביעות רצון בעבודה שונה בין גברים לנשים. מה יעשה?',
   o:[{t:'יוסיף למודל את מקדם המכפלה של ותק במין ויבדוק את מובהקותו',ok:1,w:'"שונה בין קבוצות" = אינטראקציה, ואינטראקציה נבדקת במקדם המכפלה. שיוך קבוצתי הוא כמעט תמיד ממתן.'},
     {t:'יבדוק אם המקדם של ותק יורד כשמוסיפים את המין למודל',w:'זו בדיקת תיווך. היא תענה על שאלה אחרת לגמרי — האם המין מסביר את הקשר, לא האם הקשר שונה בין הקבוצות.'},
     {t:'יחשב מתאם חלקי בין ותק לשביעות רצון בניכוי מין',w:'מתאם חלקי נותן קשר יחיד מנוטרל. הוא לא יכול להראות שהקשר שונה בין הקבוצות.'},
     {t:'ישווה את ממוצעי שביעות הרצון בין גברים לנשים',w:'זו בדיקת הבדל בממוצעים — אפקט ראשי של מין, לא הבדל בעוצמת הקשר.'}]},
  {q:'איזו דרישה קיימת בתיווך ואינה רצויה במיתון?',
   o:[{t:'מתאם משמעותי בין המשתנה השלישי למנבא',ok:1,w:'בתיווך נתיב a הוא תנאי הכרחי — בלי קשר בין X ל־M אין שרשרת. במיתון, מתאם גבוה בין הממתן למנבא דווקא מקשה על פירוש המודל.'},
     {t:'מדגם גדול',w:'מדגם גדול מועיל בשני המקרים ואינו מבחין ביניהם. אם כבר, אינטראקציות דורשות מדגמים גדולים יותר.'},
     {t:'משתנה רציף',w:'שני המודלים עובדים גם עם משתנים קטגוריאליים. מיתון בפרט משתמש בהם הרבה.'},
     {t:'תכנון ניסויי',w:'שני המודלים נבדקים לרוב במחקר מתאמי, ואף אחד מהם אינו דורש ניסוי.'}]},
  {q:'"ההשפעה של איכות השינה על הריכוז חזקה יותר בקרב מבוגרים מבוגרים." אם חוקר יבחן זאת כתיווך, מה תהיה הבעיה?',
   o:[{t:'הגיל לא נוצר בעקבות איכות השינה, ולכן אינו יכול להיות חוליה בשרשרת',ok:1,w:'מתווך חייב להיות מושפע מהמנבא. גיל קודם לכל משתנה במחקר, ולכן מבנית הוא יכול להיות רק ממתן.'},
     {t:'הגיל אינו רציף מספיק',w:'גיל הוא משתנה רציף לגמרי. הבעיה מבנית, לא מדידתית.'},
     {t:'אין מספיק מנבאים במודל',w:'מספר המנבאים אינו נוגע לשאלה אם מודל התיווך מתאים תיאורטית.'},

{d:1,t:'תוספת לשונות מוסברת (ΔR²)',lvl:'core',
 why:'הנושא שמחבר בין הכל — sr², אינטראקציה, השוואת מודלים. שאלה עליו היא בעצם שאלה על שלושה נושאים.',

 learn:[
  {h:'מה זה מודד',p:['ΔR² שואל שאלה מעשית: <span class="k">האם המנבא הזה שווה את מקומו במודל?</span> משווים בין המודל המלא לבין אותו מודל בלי המנבא, ובודקים אם ההפרש בשונות המוסברת גדול מספיק כדי להיות מובהק.',
  'החיבור החשוב: <span class="k">ΔR² = sr²</span> של המנבא שנוסף. אלו לא שני מושגים — זה אותו מספר משתי זוויות. אם רשמת את זה בדף העזר, שאלה על כל אחד מהם נפתרת בזכות השני.'],
  f:['ΔR² = R²(מלא) − R²(מצומצם)','F = [ΔR² / k] / [(1−R²מלא) / (N−K−1)]','מנבא יחיד:  F = t²']},
  {h:'שתי עובדות שמייצרות שאלות',p:['<span class="k">R² לעולם לא יורד</span> כשמוסיפים מנבא. גם מנבא אקראי לחלוטין יעלה אותו במעט. לכן השאלה אף פעם אינה "האם R² עלה" אלא "האם העלייה מובהקת".',
  '<span class="k">R² מותאם</span> מעניש על מספר המנבאים, ולכן הוא <span class="k">כן</span> יכול לרדת. ירידה בו כשמוסיפים מנבא היא סימן שהמנבא לא הצדיק את עצמו.']},
  {h:'מובהקות מול חשיבות',p:['ΔR² של .01 יכול לצאת מובהק כשN הוא 5000, ו־ΔR² של .09 יכול לא לצאת מובהק כשN הוא 20. מובהקות מערבבת גודל אפקט עם גודל מדגם. שאלה תיאורטית אוהבת לבדוק אם את מפרידה ביניהם.']}
 ],
 key:['ΔR² = sr² של המנבא שנוסף','R² לעולם לא יורד; R² מותאם כן','מנבא יחיד: F של התוספת = t² של המקדם','מובהקות ≠ חשיבות'],
 traps:['לחבר ΔR² ל־pr². זה sr².','להסיק ממנבא שהעלה את R² שהוא תורם. כל מנבא מעלה את R² במשהו.','לזכור לא נכון את דרגות החופש: המכנה הוא N−K−1 עם K המנבאים במודל המלא.'],
 slots:[
  {l:'נוסחת F לתוספת + מה כל אות',h:'רשמי במפורש מה זה k ומה זה K. זו הטעות הכי נפוצה בנוסחה הזו.'},
  {l:'הקשר בין ΔR², sr² ו־F',h:'שרשרת קצרה. זו השורה שתחסוך לך שתי שאלות.'},
  {l:'R² מול R² מותאם',h:'שתי שורות: מי יכול לרדת ומתי.'},
  {l:'מובהקות מול גודל אפקט',h:'משפט אחד, לניסוח של שאלה תיאורטית.'}
 ],
 must:['ΔR² = sr²','ש־R² לעולם לא יורד','דרגות החופש: k במונה, N−K−1 במכנה'],
 qs:[
  {q:'חוקר מוסיף מנבא רביעי למודל. R² עולה מ־.41 ל־.415, אך ה־F לתוספת אינו מובהק. מה המסקנה?',
   o:[{t:'התוספת אינה שונה מאפס באופן מובהק — אין הצדקה להשאיר את המנבא',ok:1,w:'R² תמיד יעלה במשהו, ולכן העלייה עצמה חסרת משמעות. המבחן הוא אם התוספת גדולה מספיק מכדי לנבוע מרעש מדגמי, וכאן היא לא.'},
     {t:'המנבא תורם, אך תרומתו קטנה',w:'אין ראיה סטטיסטית שהוא תורם בכלל. תוספת לא מובהקת אינה "תרומה קטנה" אלא תוצאה שלא ניתן להבדילה מאפס.'},
     {t:'יש טעות בחישוב — R² לא אמור לעלות כאן',w:'R² יעלה כמעט תמיד כשמוסיפים מנבא, גם מנבא חסר קשר לחלוטין.'},
     {t:'צריך להסיר מנבא אחר במקום',w:'הנתונים לא אומרים דבר על שאר המנבאים.'}]},
  {q:'המתאם החלקי־למחצה של מנבא הוא .40. מהי תוספת השונות המוסברת שלו?',

     {t:'‎.40‎',w:'‎.40‎ הוא המתאם עצמו. תוספת שונות היא תמיד בריבוע.'},
     {t:'‎.60‎',w:'‎1 − .40‎ אינו קשור לחישוב הזה בשום צורה.'},
     {t:'אי אפשר לדעת בלי R² של המודל המלא',w:'הזהות ΔR² = sr² עומדת בפני עצמה ואינה דורשת את R².'}],
   n:'שרשרת אחת לדף: sr → sr² → ΔR². בשני הכיוונים.'},
  {q:'במודל מוסיפים מנבא יחיד. ה־t של המקדם שלו הוא 2.5. מה ה־F לתוספת השונות המוסברת?',
   o:[{t:'‎6.25‎',ok:1,w:'כשמדובר במנבא בודד, ‎F = t²‎. ‎2.5² = 6.25‎. שני המבחנים בודקים בדיוק את אותה השערה.'},
     {t:'‎2.5‎',w:'F ו־t אינם שווים ישירות. הקשר ביניהם הוא ריבוע, ורק במקרה של מנבא יחיד.'},
     {t:'‎1.58‎ (שורש 2.5)',w:'הכיוון הפוך: מ־t ל־F מעלים בריבוע, לא מוציאים שורש.'},
     {t:'אי אפשר בלי דרגות החופש',w:'דרגות החופש דרושות כדי להכריע מובהקות, אך ערך ה־F עצמו נובע מ־t².'}]},
  {q:'מוסיפים מנבא ו־R² עולה מ־.30 ל־.34, אך R² המותאם יורד מ־.28 ל־.27. מה זה מלמד?',
   o:[{t:'התוספת אינה מצדיקה את המנבא הנוסף ביחס לגודל המדגם',ok:1,w:'R² מותאם מעניש על כל מנבא נוסף. ירידה שלו פירושה שהעלייה ב־R² קטנה מהעלייה הצפויה ממנבא חסר ערך.'},
     {t:'יש טעות — R² מותאם לא יכול לרדת',w:'הוא בהחלט יכול, וזה בדיוק ההבדל בינו לבין R² הרגיל.'},
     {t:'המודל המלא גרוע מהמודל הריק',w:'‎R²‎ מותאם של ‎.27‎ עדיין גבוה. המודל מסביר לא מעט; רק המנבא האחרון לא הצדיק את עצמו.'},
     {t:'המנבא הנוסף מתואם שלילית עם המנובא',w:'סימן המתאם לא נוגע לחישוב הזה כלל.'}]},
  {q:'מודל א׳ עם 2 מנבאים, מודל ב׳ עם 4 מנבאים על אותם נתונים. איזו טענה נכונה בהכרח?',

     {t:'מודל ב׳ מנבא טוב יותר',w:'‎R²‎ גבוה יותר על אותם נתונים אינו ניבוי טוב יותר. עודף מנבאים מוביל להתאמת יתר.'},
     {t:'ה־F של מודל ב׳ גדול יותר',w:'‎F‎ מחלק במספר המנבאים, ולכן מנבאים חלשים יכולים דווקא להקטין אותו.'},
     {t:'‎R²‎ המותאם של מודל ב׳ גדול יותר',w:'המותאם מעניש על מנבאים, ולכן הוא עשוי לרדת. רק ‎R²‎ הרגיל מובטח.'}]}
 ]},

  {q:'מחקר עם עוצמה סטטיסטית נמוכה שהניב תוצאה מובהקת — מה סביר לגביו?',
   o:[{t:'גודל האפקט המדווח מנופח כלפי מעלה',ok:1,w:'כשהעוצמה נמוכה, רק אומדנים גדולים במיוחד חוצים את סף המובהקות. לכן הממצאים ששורדים מטים את גודל האפקט כלפי מעלה באופן שיטתי.'},
     {t:'האפקט אמין במיוחד כי שרד סף מחמיר',w:'ההפך. עוצמה נמוכה מעלה את הסיכוי שהתוצאה שגויה או מנופחת.'},
     {t:'העוצמה אינה משפיעה על גודל האפקט המדווח',w:'היא משפיעה מאוד, דרך מנגנון הסינון של סף המובהקות.'},
     {t:'התוצאה בהכרח מזויפת',w:'עוצמה נמוכה אינה עדות למרמה. היא בעיה מתודולוגית, לא אתית.'}]},
  {q:'מה ההבדל בין הטיית פרסום ל־p-hacking?',
   o:[{t:'הטיית פרסום היא ברמת המערכת — מה מתפרסם; p-hacking הוא ברמת החוקר — כיצד נותחו ודווחו הנתונים',ok:1,w:'שתיהן מטות את הספרות, אך במקומות שונים בשרשרת. פתרונן שונה בהתאם: פרסום תוצאות אפס מול פרה־רגיסטרציה.'},
     {t:'הן מונחים נרדפים',w:'הן קשורות אך נבדלות בשלב שבו ההטיה נכנסת.'},
     {t:'הטיית פרסום היא מכוונת ו־p-hacking אינו',w:'לרוב זה דווקא הפוך, וממילא הכוונה אינה הקריטריון המבחין.'},
     {t:'p-hacking נוגע רק לרגרסיה',w:'הוא נוגע לכל ניתוח סטטיסטי שבו יש חופש בחירה בין דרכי ניתוח.'}]}
 ]}
];

/* day 4 items */
var D4=[
 {t:'סבב מפת המלכודות',m:'עברי על כל המלכודות מכל הבלוקים ברצף אחד. לכל אחת שאלי את עצמך: "האם אני יודעת למה זו מלכודת?" אם לא — חזרי לבלוק לחמש דקות.'},
 {t:'תרגול ניווט בדפים',m:'זה התרגול שהכי חוסך זמן במבחן. פתחי את הדפים שכתבת, קחי עשר מלכודות אקראיות, ומצאי כל אחת בדפים שלך תוך פחות מ־15 שניות. אם משהו לוקח יותר — הוא לא במקום הנכון בדף.'},
 {t:'שאלות מעורבות',m:'חזרי לבלוקים 1–4 ו־5–7 ופתרי שוב את השאלות בערבוב. הפעם, לפני שאת בוחרת — נסחי לעצמך למה כל מסיח שגוי.'},
 {t:'חמש הדקות האחרונות',m:'רשמי בראש הדף הראשון שלוש שורות בלבד: תיווך=ירידה, דיכוי=עלייה. sr²=ΔR². b₁ באינטראקציה = השיפוע כש־M=0. אלה שלוש השורות שיחזירו לך את ההתמצאות אם תיתקעי.'}
];

/* ================= render ================= */
var app=document.getElementById('app');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function render(){
  if(view==='track'){ openBlock===null?renderTrack():renderBlock(); }
  else if(view==='sheets') renderSheets();
  else if(view==='traps') renderTraps();
  else renderHow();
  updateBar();
}

function updateBar(){
  var done=0; for(var i=0;i<B.length;i++){ if(S.load('done'+i)==='1') done++; }
  document.getElementById('pbar').style.width=Math.round(done/B.length*100)+'%';
}

function renderTrack(){
  var h='<div class="days">';
  for(var i=0;i<DAYS.length;i++)
    h+='<div class="day'+(i===day?' on':'')+'" data-day="'+i+'"><div class="dn">'+DAYS[i].n+'</div><div class="dm">'+DAYS[i].m+'</div></div>';
  h+='</div><div class="dayintro">'+DAYS[day].intro+'</div>';

  if(day===3){
    for(var j=0;j<D4.length;j++)
      h+='<div class="mini"><h3>'+D4[j].t+'</h3><p>'+D4[j].m+'</p></div>';
    h+='<div class="mini"><h3>לפני שאת סוגרת</h3><p>הדפיסי את דפי העזר שכתבת. עדיף על נייר מאשר במסך — במבחן את מדפדפת, לא גוללת.</p><button class="btn" data-go="sheets">לדפי העזר שלי</button></div>';
  } else {
    for(var k=0;k<B.length;k++){
      if(B[k].d!==day) continue;
      var dn=S.load('done'+k)==='1';
      h+='<div class="blk'+(dn?' done':'')+'" data-b="'+k+'">'+
         '<div class="num">'+(dn?'✓':(k+1))+'</div><div><h3>'+B[k].t+'</h3><p>'+B[k].why+'</p>'+
         '<span class="tag '+B[k].lvl+'">'+(B[k].lvl==='core'?'ליבה':B[k].lvl==='mid'?'חשוב':'נקודות זולות')+'</span></div></div>';
    }
  }
  app.innerHTML=h;
  bindTrack();
}

function bindTrack(){
  var ds=app.querySelectorAll('[data-day]');
  for(var i=0;i<ds.length;i++) ds[i].onclick=function(){day=+this.getAttribute('data-day');render()};
  var bs=app.querySelectorAll('[data-b]');
  for(var j=0;j<bs.length;j++) bs[j].onclick=function(){openBlock=+this.getAttribute('data-b');phase=0;render();window.scrollTo(0,0)};
  var g=app.querySelector('[data-go]');
  if(g) g.onclick=function(){view='sheets';setTop('sheets');render();window.scrollTo(0,0)};
}

/* ---- block ---- */
var tSec=1500,tRun=null;
function renderBlock(){
  var b=B[openBlock];
  var h='<button class="back">‹ חזרה למסלול</button>';
  h+='<div class="bhead"><h2>'+b.t+'</h2><div class="why">'+b.why+'</div>'+
     '<div class="timer"><span class="t" id="tdisp">'+fmt(tSec)+'</span>'+
     '<button id="tbtn">'+(tRun?'עצור':'התחל 25 דקות')+'</button>'+
     '<button class="ghost" id="trst">אפס</button></div></div>';
  h+='<div class="phases">'+
     '<button data-p="0"'+(phase===0?' class="on"':'')+'>1 · הבנה</button>'+
     '<button data-p="1"'+(phase===1?' class="on"':'')+'>2 · הדף שלי</button>'+
     '<button data-p="2"'+(phase===2?' class="on"':'')+'>3 · שאלות</button></div>';
  h+='<div class="panel">'+(phase===0?learnHTML(b):phase===1?sheetHTML(b,openBlock):qHTML(b,openBlock))+'</div>';
  app.innerHTML=h;

  app.querySelector('.back').onclick=function(){openBlock=null;render();window.scrollTo(0,0)};
  var ps=app.querySelectorAll('[data-p]');
  for(var i=0;i<ps.length;i++) ps[i].onclick=function(){phase=+this.getAttribute('data-p');render();window.scrollTo(0,0)};
  document.getElementById('tbtn').onclick=toggleTimer;
  document.getElementById('trst').onclick=function(){tSec=1500;if(tRun){clearInterval(tRun);tRun=null}render()};
  if(phase===1) bindSheet(openBlock);
  if(phase===2) bindQs(openBlock);
}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
function toggleTimer(){
  if(tRun){clearInterval(tRun);tRun=null;render();return}
  tRun=setInterval(function(){
    tSec--; var d=document.getElementById('tdisp'); if(d)d.textContent=fmt(tSec);
    if(tSec<=0){clearInterval(tRun);tRun=null;tSec=1500;render();}
  },1000);
  render();
}

function learnHTML(b){
  var h='';
  for(var i=0;i<b.learn.length;i++){
    var s=b.learn[i];
    h+='<h4>'+s.h+'</h4>';
    if(s.p) for(var j=0;j<s.p.length;j++) h+='<p>'+s.p[j]+'</p>';
    if(s.f) for(var k=0;k<s.f.length;k++) h+='<span class="f">'+esc(s.f[k])+'</span>';
    if(s.tbl){
      h+='<table class="cmp">';
      for(var r=0;r<s.tbl.length;r++){
        h+='<tr>';
        for(var c=0;c<s.tbl[r].length;c++) h+=(r===0?'<th>':'<td>')+s.tbl[r][c]+(r===0?'</th>':'</td>');
        h+='</tr>';
      }
      h+='</table>';
    }
  }
  if(b.venn && b.venn.length) h+=venn(b.venn,b.vcap);
  h+='<div class="keybox"><b>לזכור</b><ul>';
  for(var m=0;m<b.key.length;m++) h+='<li>'+b.key[m]+'</li>';
  h+='</ul></div><div class="trapbox"><b>מלכודות</b><ul>';
  for(var n=0;n<b.traps.length;n++) h+='<li>'+b.traps[n]+'</li>';
  h+='</ul></div>';
  return h;
}

function sheetHTML(b,idx){
  var h='<div class="sheetnote">עכשיו את כותבת. לא מעתיקה — <b>מנסחת מחדש במילים שלך</b>. זה החלק שבו הלמידה קורית בפועל, ובסוף יש לך דף שאת יודעת לנווט בו כי את בנית אותו.</div>';
  for(var i=0;i<b.slots.length;i++){
    h+='<div class="slot"><label>'+b.slots[i].l+'</label><div class="hint">'+b.slots[i].h+'</div>'+
       '<textarea data-s="'+idx+'_'+i+'">'+esc(S.load('s'+idx+'_'+i))+'</textarea></div>';
  }
  h+='<div class="must"><b>חייב להופיע בדף</b><ul>';
  for(var j=0;j<b.must.length;j++) h+='<li>'+b.must[j]+'</li>';
  h+='</ul></div>';
  h+='<div style="margin-top:18px"><button class="btn" id="mark">'+(S.load('done'+idx)==='1'?'✓ הבלוק הושלם':'סמני שהבלוק הושלם')+'</button></div>';
  return h;
}
function bindSheet(idx){
  var ts=app.querySelectorAll('[data-s]');
  for(var i=0;i<ts.length;i++){
    ts[i].oninput=function(){S.save('s'+this.getAttribute('data-s'),this.value)};
  }
  document.getElementById('mark').onclick=function(){
    S.save('done'+idx, S.load('done'+idx)==='1'?'0':'1'); render();
  };
}

function qHTML(b,idx){
  var h='';
  for(var i=0;i<b.qs.length;i++){
    var q=b.qs[i];
    h+='<div class="q" data-q="'+i+'"><div class="qn">שאלה '+(i+1)+' / '+b.qs.length+'</div><div class="qt">'+q.q+'</div>';
    for(var j=0;j<q.o.length;j++)
      h+='<div class="opt" data-o="'+i+'_'+j+'" data-ok="'+(q.o[j].ok?1:0)+'">'+q.o[j].t+'<div class="ex">'+q.o[j].w+'</div></div>';
    if(q.n) h+='<div class="qnote" data-n="'+i+'"><b>שווה לרשום: </b>'+q.n+'</div>';
    h+='</div>';
  }
  return h;
}
function bindQs(idx){
  var os=app.querySelectorAll('[data-o]');
  for(var i=0;i<os.length;i++){
    os[i].onclick=function(){
      var qi=this.getAttribute('data-o').split('_')[0];
      var sib=app.querySelectorAll('[data-o^="'+qi+'_"]');
      var ok=this.getAttribute('data-ok')==='1';
      for(var k=0;k<sib.length;k++){
        sib[k].className='opt shown'+(sib[k].getAttribute('data-ok')==='1'?' rev-ok':'');
      }
      this.className='opt shown '+(ok?'sel-ok':'sel-no');
      var nt=app.querySelector('[data-n="'+qi+'"]'); if(nt) nt.className='qnote shown';
    };
  }
}

/* ---- sheets view ---- */
function renderSheets(){
  var h='<div class="mini"><h3>עשרת דפי העזר</h3><p>כל מה שכתבת בבלוקים מרוכז כאן. הכפתור פותח חלון הדפסה — משם אפשר להדפיס או לשמור כ־PDF. כל בלוק יוצא בעמוד נפרד, וזה בדיוק המבנה שקל לנווט בו במבחן.</p>'+
  '<p style="font-size:14px;color:var(--muted)">אם עדיין לא כתבת הרבה — זה בסדר. הדפיסי בסוף כל יום, לא בסוף הכל.</p>'+
  '<button class="btn" id="pr">פתח חלון הדפסה</button> <button class="btn o" id="pr2">רענן תצוגה מקדימה</button></div>';
  var any=false;
  for(var i=0;i<B.length;i++){
    var txt='',filled=0;
    for(var j=0;j<B[i].slots.length;j++){
      var v=S.load('s'+i+'_'+j);
      if(v){filled++; txt+='<div style="margin-bottom:10px"><b style="font-size:14.5px">'+B[i].slots[j].l+'</b><div style="white-space:pre-wrap;font-size:15px;color:#3C4257">'+esc(v)+'</div></div>';}
    }
    if(filled){
      any=true;
      h+='<div class="mini"><h3>'+(i+1)+'. '+B[i].t+'</h3>'+txt+'<span class="pill">'+filled+' מתוך '+B[i].slots.length+' סעיפים</span></div>';
    }
  }
  if(!any) h+='<div class="mini"><p>עוד לא נכתב כלום. חזרי למסלול, בחרי בלוק, ועברי ללשונית "הדף שלי".</p></div>';
  app.innerHTML=h;
  document.getElementById('pr').onclick=doPrint;
  document.getElementById('pr2').onclick=render;
}

function doPrint(){
  var pa=document.getElementById('printArea'),h='';
  for(var i=0;i<B.length;i++){
    var body='',filled=false;
    for(var j=0;j<B[i].slots.length;j++){
      var v=S.load('s'+i+'_'+j);
      if(v){filled=true; body+='<h3>'+B[i].slots[j].l+'</h3><div class="pv">'+esc(v)+'</div>';}
    }
    if(!filled) continue;
    for(var t=0;t<B[i].traps.length;t++) body+='<div class="pt">מלכודת: '+B[i].traps[t].replace(/<[^>]+>/g,'')+'</div>';
    h+='<div class="psheet"><h2>'+(i+1)+'. '+B[i].t+'</h2>'+body+'</div>';
  }
  if(!h) h='<div class="psheet"><h2>אין עדיין תוכן</h2><p>מלאי את הסעיפים בבלוקים ונסי שוב.</p></div>';
  pa.innerHTML=h;
  window.print();
}

/* ---- traps view ---- */
function renderTraps(){
  var h='<div class="mini"><h3>כל המלכודות במקום אחד</h3><p>זה המסמך של חצי היום האחרון. עברי עליו ברצף ושאלי על כל שורה: "אני יודעת למה זו מלכודת?" אם לא — חזרי לבלוק.</p></div>';
  for(var i=0;i<B.length;i++){
    h+='<div class="mini"><h3 style="font-size:17px">'+(i+1)+'. '+B[i].t+'</h3><ul style="padding-inline-start:19px;font-size:15px">';
    for(var j=0;j<B[i].traps.length;j++) h+='<li style="margin-bottom:6px">'+B[i].traps[j]+'</li>';
    h+='</ul></div>';
  }
  app.innerHTML=h;
}

/* ---- how view ---- */
function renderHow(){
  app.innerHTML='<div class="mini"><h3>איך עובדים עם זה</h3>'+
  '<p><b>בלוק אחד = 25 דקות.</b> מפעילים את הטיימר, עוברים על "הבנה", כותבים את "הדף שלי", ופותרים את השאלות. כשהטיימר נגמר — קמים לחמש דקות. גם באמצע משפט.</p>'+
  '<p><b>אל תדלגי על שלב הכתיבה.</b> הוא נראה כמו העבודה המשעממת, והוא בעצם כל הלימוד. דף עזר שקראת שווה הרבה פחות מדף עזר שכתבת — במבחן את יודעת לנווט רק במה שאת בנית.</p>'+
  '<p><b>סדר הבלוקים אינו מקרי.</b> יום 1 נושא את רוב הציון. אם נגמר הזמן, עדיף לדעת את ארבעת הבלוקים הראשונים לעומק מאשר להעיף מבט בכולם.</p>'+
  '<p><b>בשאלות, לפני שאת לוחצת</b> — נסחי לעצמך למה כל מסיח שגוי. אחרי הלחיצה נפתחים ההסברים לכל התשובות, לא רק לזו שבחרת. שם נמצא רוב הערך.</p>'+
  '<p><b>מה שכתבת נשמר בדפדפן הזה.</b> אותו מכשיר, אותו דפדפן, בלי גלישה פרטית. בסוף כל יום כדאי להדפיס או לשמור כ־PDF מלשונית "דפי העזר שלי".</p></div>'+
  '<div class="mini"><h3>מה בחוץ</h3><p>קידוד דמי אינו בחומר ולא מופיע כאן בכלל.</p></div>'+
  '<div class="mini"><h3>אם נשאר זמן רק לדבר אחד</h3><p>שלוש השורות האלה מכסות את הפער הגדול ביותר בין ציון בינוני לציון טוב:</p>'+
  '<p style="font-size:15.5px">· תיווך = המקדם <b>יורד</b>. דיכוי = המקדם <b>עולה</b>.<br>· sr² = ΔR². (לא pr².)<br>· במודל עם אינטראקציה, b₁ הוא השיפוע כאשר M=0 — לא האפקט הכללי.</p></div>';
}

/* ---- nav ---- */
function setTop(v){
  var ns=document.querySelectorAll('nav.top button');
  for(var i=0;i<ns.length;i++) ns[i].className=(ns[i].getAttribute('data-v')===v?'on':'');
}
var nb=document.querySelectorAll('nav.top button');
for(var i=0;i<nb.length;i++){
  nb[i].onclick=function(){
    view=this.getAttribute('data-v'); openBlock=null;
    setTop(view); render(); window.scrollTo(0,0);
  };
}
render();
</script>
</body>
</html>
